<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results - BeautyNest</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="project_css.css">
    
</head>

<body>
    <header class="site-header">
        <h1>BeautyNest</h1>
        <p>Essential Oil Jewelry & Handcrafted Beauty</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="Necklace.html">Necklaces</a></li>
            <li><a href="Earring.html">Earrings</a></li>
            <li><a href="Bracelets.html">Bracelets</a></li>
            <li><a href="Cart.html">🛒</a></li>
            <li><a href="/auth/google">Login</a></li>
            <li class="search-container">
                <input type="text" id="searchInput" placeholder="Search products...">
            </li>
        </ul>
    </nav>

    <section class="products">
        <h2 id="resultsTitle">Search Results</h2>
        <div id="results"></div>
        <p id="message"></p>
    </section>
    

    <footer>
        <p>© 2026 BeautyNest | Designed for CISC 4900 Project</p>
    </footer>

    <script>
    const params = new URLSearchParams(window.location.search);
    const keyword = params.get("q") || "";

    const resultsTitle = document.getElementById("resultsTitle");
    const resultsDiv = document.getElementById("results");
    const message = document.getElementById("message");
    const searchInput = document.getElementById("searchInput");

    resultsTitle.textContent = `Search Results for "${keyword}"`;
    searchInput.value = keyword;

    function renderResults(products) {
        resultsDiv.innerHTML = "";
        message.textContent = "";

        if (!products || products.length === 0) {
            message.textContent = "No products found.";
            return;
        }

        products.forEach(product => {
            const card = document.createElement("div");
            card.className = "product-card";

             card.innerHTML = `
                <img src="${product.image_url}" alt="${product.name}">
                <h3>${product.name}</h3>
                <p class="product-description">
                    Item Detail: ${product.description}
                </p>
                <p class="price">$${parseFloat(product.price).toFixed(2)}</p>
                <button class="btn">Add to Cart</button>
            `;

            resultsDiv.appendChild(card);
        });
    }

    if (keyword.trim() !== "") {
        fetch(`/search?q=${encodeURIComponent(keyword)}`)
            .then(response => response.json())
            .then(data => {
                renderResults(data);
            })
            .catch(error => {
                console.error("Search fetch error:", error);
                message.textContent = "Error loading search results.";
            });
    } else {
        message.textContent = "Please enter a search keyword.";
    }

    searchInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            const newKeyword = searchInput.value.trim();
            if (!newKeyword) return;
            window.location.href = `search-result.html?q=${encodeURIComponent(newKeyword)}`;
        }
    });
</script>

</body>
</html>
