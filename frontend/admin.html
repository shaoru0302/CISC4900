<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard - BeautyNest</title>
  <link rel="stylesheet" href="project_css.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .container {
      width: 100%;
      text-align: center;
      padding-top: 80px;
    }

    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }

    nav {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>BeautyNest</h1>

    <nav>
      <a href="/">Home</a>
      <a href="/logout">Logout</a>
    </nav>

    <h2>Admin Dashboard</h2>
    <p id="welcomeText">Loading...</p>

    <section>
      <h3>Admin Controls</h3>
      <p>Manage Products | View Orders | Update Inventory</p>
    </section>
  </div>

  <script>
    fetch("/api/me")
      .then(res => res.json())
      .then(data => {
        if (!data.loggedIn || data.role !== "admin") {
          window.location.href = "/";
          return;
        }

        document.getElementById("welcomeText").innerText =
          "Welcome " + data.displayName;
      })
      .catch(() => {
        window.location.href = "/";
      });
  </script>

</body>
</html>
