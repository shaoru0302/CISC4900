<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard - BeautyNest</title>
  <link rel="stylesheet" href="project_css.css">
  <link rel="stylesheet" href="admin.css">
</head>

<body>
  <div class="container">
    <h1>BeautyNest</h1>

    <nav>
      <a href="/">Home</a>
      <a href="/admin.html">Dashboard</a>
      <a href="/admin_products.html">Products</a>
      <a href="/admin_orders.html">Orders</a>
      <a href="/logout">Logout</a>
    </nav>

    <h2>Admin Dashboard</h2>
    <p id="welcomeText">Loading...</p>

    <section>
      <h3>Dashboard Summary</h3>

      <div class="cards">
        <div class="card">
          <h3>Total Products</h3>
          <p id="totalProducts">0</p>
        </div>

        <div class="card">
          <h3>Total Orders</h3>
          <p id="totalOrders">0</p>
        </div>

        <div class="card">
          <h3>Pending Orders</h3>
          <p id="pendingOrders">0</p>
        </div>

        <div class="card">
          <h3>Low Stock Products</h3>
          <p id="lowStockProducts">0</p>
        </div>
      </div>
    </section>
  </div>

  <footer>
    <p>© 2026 BeautyNest | Designed for CISC 4900 Project</p>
  </footer>
  

  <script src="admin_dashboard.js"></script>

  
</body>
</html>
